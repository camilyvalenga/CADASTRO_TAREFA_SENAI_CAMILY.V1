<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas ✨</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container-principal">

        <!-- CARD 1: CABEÇALHO E ENTRADA -->
        <div class="cartao-aplicacao">
            <header class="cabecalio-aplicacao">
                <h1>Mɪɴʜᴀs Tᴀʀᴇғᴀs✨</h1>
                <button class="botao-icone" id="botao-alterar-tema">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
            </header>

            <div class="caixa-entrada">
                <input type="text" id="campo-tarefa" placeholder="O que vamos fazer hoje?..." maxlength="40">
                <button class="botao-principal" id="botao-adicionar">
                    <i class="fa-solid fa-plus"></i>Adicionar
                </button>
            </div>
            
            <footer class="radape-aplicacao">
                <span id="contador-tarefas">0 tarefas na lista</span>
            </footer>
        </div>

        <!-- CARD 2: PAINEL DE TAREFAS PENDENTES -->
        <div class="cartao-aplicacao card-secao">
            <h2>⌛︎ Pendentes</h2>
            <ul class="lista-tarefas" id="lista-pendentes"></ul>
        </div>

        <!-- CARD 3: PAINEL DE TAREFAS CONCLUÍDAS -->
        <div class="cartao-aplicacao card-secao">
            <h2>✓ Concluídas</h2>
            <ul class="lista-tarefas" id="lista-concluidas"></ul>
        </div>

    </div>

    <script src="script.js"></script>

    <img id="imagem-coelho" src="coelho.gif" alt="">
    <img id="imagem-onça" src="onça.gif" alt="">
    <img id="fotominha" src="fotominha.jpeg" alt="">
</body>

</html>
